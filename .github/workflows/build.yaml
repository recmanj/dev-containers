name: Build

on:
  push:
    branches: main
    paths-ignore:
      - "**.md"
      - LICENSE
      - renovate.json
      - .pre-commit-config.yaml
      - .hadolint.yaml
      - zizmor.yml
      - .github/workflows/lint.yaml
      - .github/workflows/scan.yaml
  pull_request:
    branches: main
    paths-ignore:
      - "**.md"
      - LICENSE
      - renovate.json
      - .pre-commit-config.yaml
      - .hadolint.yaml
      - zizmor.yml
      - .github/workflows/lint.yaml
      - .github/workflows/scan.yaml
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      no-cache:
        description: Build without cache
        type: boolean
        default: false

# A newer push to the same PR cancels the older run, so the pr-<number>
# parent images can't be swapped out mid-run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-base:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yaml
    with:
      context: base
      no-cache: ${{ inputs.no-cache == true }}

  build-base-agent:
    permissions:
      contents: read
      packages: write
    needs: build-base
    uses: ./.github/workflows/build-image.yaml
    with:
      context: base-agent
      no-cache: ${{ inputs.no-cache == true }}

  build-claude:
    permissions:
      contents: read
      packages: write
    needs: build-base-agent
    uses: ./.github/workflows/build-image.yaml
    with:
      context: claude
      no-cache: ${{ inputs.no-cache == true }}

  build-t3:
    permissions:
      contents: read
      packages: write
    needs: build-claude
    uses: ./.github/workflows/build-image.yaml
    with:
      context: t3
      no-cache: ${{ inputs.no-cache == true }}

  build-codex:
    permissions:
      contents: read
      packages: write
    needs: build-base-agent
    uses: ./.github/workflows/build-image.yaml
    with:
      context: codex
      no-cache: ${{ inputs.no-cache == true }}

  build-gemini:
    permissions:
      contents: read
      packages: write
    needs: build-base-agent
    uses: ./.github/workflows/build-image.yaml
    with:
      context: gemini
      no-cache: ${{ inputs.no-cache == true }}

  build-opencode:
    permissions:
      contents: read
      packages: write
    needs: build-base-agent
    uses: ./.github/workflows/build-image.yaml
    with:
      context: opencode
      no-cache: ${{ inputs.no-cache == true }}

  build-pi:
    permissions:
      contents: read
      packages: write
    needs: build-base-agent
    uses: ./.github/workflows/build-image.yaml
    with:
      context: pi
      no-cache: ${{ inputs.no-cache == true }}

  build-distrobox-base:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yaml
    with:
      context: distrobox/base
      no-cache: ${{ inputs.no-cache == true }}

  build-distrobox-oxidian:
    permissions:
      contents: read
      packages: write
    needs: build-distrobox-base
    uses: ./.github/workflows/build-image.yaml
    with:
      context: distrobox/oxidian
      no-cache: ${{ inputs.no-cache == true }}

  build-distrobox-ecmwf:
    permissions:
      contents: read
      packages: write
    needs: build-distrobox-base
    uses: ./.github/workflows/build-image.yaml
    with:
      context: distrobox/ecmwf
      no-cache: ${{ inputs.no-cache == true }}

  build-distrobox-eodh:
    permissions:
      contents: read
      packages: write
    needs: build-distrobox-base
    uses: ./.github/workflows/build-image.yaml
    with:
      context: distrobox/eodh
      no-cache: ${{ inputs.no-cache == true }}

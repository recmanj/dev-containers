on:
  push:
    branches: main
  pull_request:
    branches: main
  schedule: "0 4 * * *"

permissions:
  contents: read
  packages: write

jobs:
  build-base:
    uses: ./.github/workflows/build-image.yaml
    with:
      context: base

  build-claude:
    needs: build-base
    uses: ./.github/workflows/build-image.yaml
    with:
      context: claude

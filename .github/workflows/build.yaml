on:
  push:
    branches: main
  pull_request:
    branches: main
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      no-cache:
        description: Build without cache
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build-base:
    uses: ./.github/workflows/build-image.yaml
    with:
      context: base
      no-cache: ${{ inputs.no-cache == true }}

  build-base-agent:
    needs: build-base
    uses: ./.github/workflows/build-image.yaml
    with:
      context: base-agent
      no-cache: ${{ inputs.no-cache == true }}

  build-claude:
    needs: build-base-agent
    uses: ./.github/workflows/build-image.yaml
    with:
      context: claude
      no-cache: ${{ inputs.no-cache == true }}

  build-codex:
    needs: build-base-agent
    uses: ./.github/workflows/build-image.yaml
    with:
      context: codex
      no-cache: ${{ inputs.no-cache == true }}

  build-gemini:
    needs: build-base-agent
    uses: ./.github/workflows/build-image.yaml
    with:
      context: gemini
      no-cache: ${{ inputs.no-cache == true }}

  build-opencode:
    needs: build-base-agent
    uses: ./.github/workflows/build-image.yaml
    with:
      context: opencode
      no-cache: ${{ inputs.no-cache == true }}

  build-pi:
    needs: build-base-agent
    uses: ./.github/workflows/build-image.yaml
    with:
      context: pi
      no-cache: ${{ inputs.no-cache == true }}

  build-distrobox-base:
    uses: ./.github/workflows/build-image.yaml
    with:
      context: distrobox/base
      no-cache: ${{ inputs.no-cache == true }}

  build-distrobox-oxidian:
    needs: build-distrobox-base
    uses: ./.github/workflows/build-image.yaml
    with:
      context: distrobox/oxidian
      no-cache: ${{ inputs.no-cache == true }}

  build-distrobox-ecmwf:
    needs: build-distrobox-base
    uses: ./.github/workflows/build-image.yaml
    with:
      context: distrobox/ecmwf
      no-cache: ${{ inputs.no-cache == true }}

  build-distrobox-eodh:
    needs: build-distrobox-base
    uses: ./.github/workflows/build-image.yaml
    with:
      context: distrobox/eodh
      no-cache: ${{ inputs.no-cache == true }}

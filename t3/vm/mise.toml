# Command-line tools for the T3 VM. install-dev-tools.sh copies this file to
# ~/.config/mise/conf.d/t3-vm.toml and installs everything in it.
# Renovate keeps the versions current.
[tools]
yq = "4.54.3"
rtk = "1.2.0"
shellcheck = "0.11.0"
kubectl = "1.37.2"
helm = "4.3.1"
kustomize = "5.8.3"
kind = "0.33.0"
kubeconform = "0.8.0"
stern = "1.35.0"
kubectx = "0.11.0"
k9s = "0.51.0"
opentofu = "1.13.9"
terraform = "1.17.1"
tflint = "0.66.0"
